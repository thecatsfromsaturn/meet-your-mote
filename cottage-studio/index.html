<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mote Cottage Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Patrick+Hand&display=swap">
<style>
:root{--cream:#fbf6ea;--paper:#fffaf0;--ink:#4a3424;--soft:#8a6a4f;--wood:#b98455;--woodd:#8a5a36;--butter:#f6d77a;--gold:#e0a92e;--rose:#d98a8a;--sky:#bfe3ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#5a3a26 0,#2e1c12 60%,#1c110a 100%);color:var(--ink);font:15px/1.4 Nunito,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
#wrap{width:min(100vw,calc((100vh - 40px)*0.8),760px);position:relative;margin:8px auto 0}
#viewport{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;border-radius:18px;box-shadow:0 18px 50px #00000088,0 0 0 6px #6b4a32}
#rooms{position:absolute;inset:0;display:flex;width:200%;transition:transform .9s cubic-bezier(.6,.05,.3,1)}
#rooms.gal{transform:translateX(-50%)}
.room{position:relative;width:50%;height:100%;flex:none}
.room>svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hit{cursor:pointer}
.hit:focus{outline:none}
.hit:focus-visible{filter:drop-shadow(0 0 6px #fff)}
.tool{transition:transform .35s ease;transform-box:fill-box;transform-origin:center}
.tool:hover{transform:translateY(-4px)}
.tool.held{animation:float 1.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(-16px)}50%{transform:translateY(-22px)}}
.tool.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:translateY(-14px)}}
.sign{transform-box:view-box}
.sign:hover .board{animation:swing 1.2s ease-in-out}
@keyframes swing{25%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}}
.board{transform-box:view-box}
#cv{position:absolute;left:8.5%;top:20.2%;width:83%;height:49.8%;touch-action:none;border-radius:2px;background:var(--cream)}
#cv.armed{cursor:none}
#beamS,#beamG{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.42}
#beamS{background:linear-gradient(135deg,#fff1b8cc 0,#ffe39a55 35%,transparent 70%);clip-path:polygon(34% 2%,66% 2%,100% 58%,100% 88%,62% 92%)}
#beamG{background:linear-gradient(120deg,#fff1b8bb 0,#ffe39a44 40%,transparent 75%);clip-path:polygon(0 0,30% 0,95% 90%,55% 100%,0 60%)}
.motes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.motes i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fffbe8;box-shadow:0 0 6px 2px #fff3c4;opacity:0;animation:drift linear infinite}
@keyframes drift{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}85%{opacity:.7}100%{opacity:0;transform:translate(40px,120px)}}
#ghost{position:absolute;width:76px;height:76px;pointer-events:none;z-index:6;display:none;filter:drop-shadow(3px 6px 4px #5a3a2266)}
#ghost .drops{position:absolute;left:30px;top:-2px;font-size:11px;color:#3e8db3;font-weight:800;text-shadow:0 0 3px #fff}
/* ledge row */
.ledge{position:absolute;left:7%;right:7%;top:70.6%;height:6.4%;display:flex;align-items:center;gap:6px;z-index:5}
.ledge .sp{flex:1}
.btn{font:700 13px Nunito;color:var(--ink);background:var(--paper);border:2px solid var(--woodd);border-radius:999px;padding:5px 12px;cursor:pointer;box-shadow:0 2px 0 var(--woodd);white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.pri{background:var(--butter)}
.btn:disabled{opacity:.45;cursor:default}
.hand{font-family:'Patrick Hand',cursive}
/* top tags */
.tags{position:absolute;left:2.5%;top:1.6%;display:flex;gap:6px;z-index:7}
.tag{font:700 13px Nunito;background:#e6c491;border:2px solid var(--woodd);border-radius:8px;padding:4px 10px;cursor:pointer;color:var(--ink);box-shadow:0 2px 0 var(--woodd)}
#mode{position:absolute;left:50%;top:16.4%;transform:translateX(-50%);font:16px 'Patrick Hand';color:#fffaf0;background:#8a5a36dd;padding:1px 12px;white-space:nowrap;border-radius:999px;z-index:6;display:none}
/* palette dropdown */
#pal{position:absolute;left:2.5%;top:7.5%;width:min(250px,64%);background:var(--paper);border:2px solid var(--woodd);border-radius:14px;padding:12px;z-index:9;box-shadow:0 12px 30px #5a3a2255;transform-origin:top left;transform:scale(.85) translateY(-8px);opacity:0;pointer-events:none;transition:.25s}
#pal.open{transform:none;opacity:1;pointer-events:auto}
#wheelBox{position:relative;width:170px;height:170px;margin:0 auto}
#wheel{width:170px;height:170px;border-radius:50%;touch-action:none;cursor:crosshair;display:block}
#knob{position:absolute;width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--ink);pointer-events:none;transform:translate(-50%,-50%)}
.row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}
.row input[type=range]{flex:1;accent-color:var(--gold)}
#sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink)}
#szdot{width:30px;height:30px;display:flex;align-items:center;justify-content:center}
#szdot i{display:block;border-radius:50%;background:var(--ink)}
.note{font-size:12px;color:var(--soft)}
/* hourglass */
#hg{width:48px;height:70px;display:none;cursor:default;flex:none}
#hg svg{width:100%;height:100%;transition:transform .7s ease}
#status{display:none;font:16px/1.15 'Patrick Hand';color:#fffaf0;background:#6b4a2ad9;padding:5px 10px;border-radius:10px;max-width:58%}
/* toasts & caption */
#toast{position:absolute;left:50%;bottom:1.6%;transform:translate(-50%,14px);background:#5a3a22ee;color:#fffaf0;padding:6px 14px;border-radius:999px;font:16px/1.2 'Patrick Hand';opacity:0;transition:.3s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#breath{position:absolute;right:3%;bottom:16%;font:20px 'Patrick Hand';color:#fffaf0;text-shadow:0 1px 4px #5a3a22;opacity:0;transition:opacity 1s;pointer-events:none;z-index:6}
.steam path{transform-box:fill-box;transform-origin:bottom center}
.steam.breathe path{animation:none}
/* gallery wall */
#wall{position:absolute;left:6%;top:12.5%;width:88%;height:39%;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:3.2%;z-index:4}
.frm{position:relative;cursor:pointer;background:#a87447;padding:5px;border-radius:3px;box-shadow:0 6px 10px #5a3a2244;transition:transform .3s}
.frm:hover{transform:translateY(-3px) rotate(-1deg)}
.frm .mat{background:#fbf3e2;padding:4px}
.frm img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;filter:blur(2.6px) saturate(.9)}
.frm.daily{background:linear-gradient(135deg,#f1cf72,#c9922e);padding:6px}
.frm .plq{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);background:#e8c36a;font:10px Nunito;font-weight:800;padding:0 5px;border-radius:3px;white-space:nowrap;color:#5a3a22}
#wallnav{position:absolute;left:0;right:0;top:51.5%;display:none;justify-content:center;gap:10px;z-index:4}
#empty{position:absolute;left:12%;right:12%;top:26%;text-align:center;font:22px 'Patrick Hand';color:#f1e2c4;text-shadow:0 1px 3px #0008;z-index:3}
#preview{position:absolute;left:68.1%;top:56%;width:18.8%;aspect-ratio:4/3;object-fit:cover;pointer-events:none;border-radius:1px}
.sp{animation:spbob 4s ease-in-out infinite}@keyframes spbob{50%{transform:translateY(6px)}}
.cat .body{transform-box:fill-box;transform-origin:center bottom;animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03,1.06)}}
.zz{animation:zz 3.6s ease-in infinite;opacity:0}
.zz.b{animation-delay:1.2s}.zz.c{animation-delay:2.4s}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}25%{opacity:.85}100%{opacity:0;transform:translate(18px,-46px)}}
/* modal */
#modal{position:fixed;inset:0;background:#3b2716aa;display:none;align-items:center;justify-content:center;z-index:50;padding:14px;backdrop-filter:blur(3px)}
#modal.on{display:flex}
.card{background:var(--paper);border:3px solid var(--woodd);border-radius:18px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:18px;box-shadow:0 20px 50px #2a1a0e66;animation:up .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes up{from{transform:scale(.7) translateY(30px);opacity:0}}
.card h2{font:30px/1.1 'Patrick Hand';margin:0 0 4px}
.card .meta{font-size:13px;color:var(--soft);margin-bottom:8px}
.card img.big{width:100%;border:8px solid #a87447;border-radius:4px;box-shadow:inset 0 0 0 4px #fbf3e2;display:block;background:var(--cream)}
.card img.big.daily{border-color:#d9a845}
.card label{display:block;font-weight:700;font-size:13px;margin:10px 0 3px}
.card input,.card textarea{width:100%;font:15px Nunito;padding:8px 10px;border:2px solid #d9c3a0;border-radius:10px;background:#fff;color:var(--ink)}
.card textarea{resize:vertical;min-height:64px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.cm{border-top:1px dashed #d9c3a0;padding:8px 0;font-size:14px}
.cm b{font-weight:800}
.badge{font-size:10px;font-weight:800;background:#cfe3f3;color:#2f5a7a;border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.about{white-space:pre-wrap;background:#f6ecd8;border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}
.log li{margin:4px 0}
footer{max-width:760px;padding:10px 16px 18px;font-size:12px;color:#d9c3a0;text-align:center}
#prevbadge{position:fixed;right:8px;bottom:8px;font-size:11px;background:#fff8;padding:2px 8px;border-radius:8px;display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ---------- shared data: window.charm (falls back to an in-memory mock for previews) ---------- */
const PREVIEW=!window.charm;
if(PREVIEW){const m=new Map(),ls=new Set();const fire=()=>ls.forEach(f=>{try{f()}catch(e){}});
window.charm={async get(k){return m.has(k)?JSON.parse(m.get(k)):null},async set(k,v){m.set(k,JSON.stringify(v));setTimeout(fire,30)},async del(k){m.delete(k);setTimeout(fire,30)},
async list(p=''){return[...m].filter(([k])=>k.startsWith(p)).map(([k,v])=>({key:k,value:JSON.parse(v),updated_at:Date.now()}))},
async all(p=''){const o={};for(const[k,v]of m)if(k.startsWith(p))o[k]=JSON.parse(v);return o},onChange(cb){ls.add(cb);return()=>ls.delete(cb)},_m:m};
document.getElementById('prevbadge').style.display='block'}
const C=window.charm;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);
const TZ='America/Los_Angeles';
const dayKey=t=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(t||Date.now());
const fmtDay=d=>{const[y,m,dd]=d.split('-').map(Number);return new Date(Date.UTC(y,m-1,dd,12)).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'})};
const fmtTime=t=>new Date(t).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
let toastT;function toast(t,ms=2600){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),ms)}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hexRgb=h=>{const n=parseInt((h||'#333333').slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const shade=(c,f)=>c.map(v=>Math.max(0,Math.min(255,Math.round(v*f))));

/* ---------- paper ---------- */
const W=1000,H=750;
const grain=(()=>{const g=document.createElement('canvas');g.width=g.height=160;const x=g.getContext('2d'),r=mulberry(7);for(let i=0;i<900;i++){x.fillStyle=`rgba(120,90,50,${.02+r()*.04})`;x.fillRect(r()*160,r()*160,1+r()*1.5,1+r()*1.5)}return g})();
function paper(x){x.globalCompositeOperation='source-over';x.globalAlpha=1;x.fillStyle='#fbf6ea';x.fillRect(0,0,W,H);x.fillStyle=x.createPattern(grain,'repeat');x.fillRect(0,0,W,H)}

/* ---------- the painting engine (deterministic, so co-op replays match) ----------
   stroke = {tool:'pencil'|'charcoal'|'round'|'filbert', c:'#rrggbb', s:1-10, w:0..1 wetness at start, seed:int, p:[x,y,...] in 1000x750 } */
const WETLEN=Infinity;
class Painter{
constructor(x,st){this.x=x;this.st=st;this.r=mulberry(st.seed|0);this.t=st.tool;const s=Math.max(1,Math.min(10,st.s||4));
this.rgb=this.t=='pencil'?[64,60,68]:this.t=='charcoal'?[30,26,28]:hexRgb(st.c);
this.rad=this.t=='pencil'?0.9+s*0.38:this.t=='charcoal'?2.4+s*1.8:this.t=='round'?2+s*2.7:4+s*3.3;
this.w=+st.w||0;this.d=0;this.lp=null;this.wc=[];this.k=0;
const n=this.t=='filbert'?20:16;this.br=[];
for(let i=0;i<n;i++){if(this.t=='filbert'){this.br.push([(i/(n-1))*2-1,(this.r()-.5)*.3,.84+this.r()*.28])}else{const a=this.r()*6.283,m=Math.sqrt(this.r());this.br.push([Math.cos(a)*m,Math.sin(a)*m,.84+this.r()*.28])}}}
wet(){return Math.max(0,this.w-this.d/WETLEN)}
add(px,py){if(!this.lp){this.lp=[px,py];this.seg(px,py,px,py);return}const[a,b]=this.lp;this.seg(a,b,px,py);this.lp=[px,py]}
seg(a,b,c,d){const x=this.x,r=this.r,len=Math.hypot(c-a,d-b),t=this.t,R=this.rad;
if(t=='pencil'||t=='charcoal'){x.globalCompositeOperation='multiply';const step=Math.max(.7,R*.35),n=Math.max(1,Math.ceil(len/step));
for(let i=0;i<=n;i++){const u=i/n,px=a+(c-a)*u,py=b+(d-b)*u;
if(t=='pencil'){for(let j=0;j<3;j++){x.fillStyle=rgba(this.rgb,.22+r()*.3);const q=R*(r()-.5)*1.6,w=R*(r()-.5)*1.6;x.fillRect(px+q,py+w,1.1+r()*.6,1.1+r()*.6)}}
else{const m=4+R*.7|0;for(let j=0;j<m;j++){const ang=r()*6.283,dd=R*Math.sqrt(r());x.fillStyle=rgba(this.rgb,.1+r()*.22);const sz=1+r()*2.4;x.fillRect(px+Math.cos(ang)*dd,py+Math.sin(ang)*dd*.8,sz,sz*(.6+r()))}
if((this.k++)%4==0){x.fillStyle=rgba(this.rgb,.025);x.beginPath();x.arc(px,py,R*1.1,0,6.283);x.fill()}}}
this.d+=len;x.globalCompositeOperation='source-over';return}
/* brushes */
const wet=this.wet();
if(wet>0){/* watercolour: translucent, soft, layers like glaze */

function hgSVG(f){return`<svg viewBox="-30 -66 60 132" style="transform:rotate(${f?180:0}deg)"><rect x="-27" y="-64" width="54" height="10" rx="3" fill="#7a4e2c"/><rect x="-27" y="54" width="54" height="10" rx="3" fill="#7a4e2c"/><path d="M-22-56V56M22-56V56" stroke="#7a4e2c" stroke-width="5"/><circle cx="-22" cy="-56" r="4" fill="#5a3a22"/><circle cx="22" cy="-56" r="4" fill="#5a3a22"/><circle cx="-22" cy="56" r="4" fill="#5a3a22"/><circle cx="22" cy="56" r="4" fill="#5a3a22"/>
<path d="M-16-54Q-16-12 0-4Q16-12 16-54Z M-16 54Q-16 4 0-4Q16 4 16 54Z" fill="#eef7fa" opacity=".85" stroke="#b9cfd6" stroke-width="1.5"/>
<clipPath id="ct1"><path d="M-16-54Q-16-12 0-4Q16-12 16-54Z"/></clipPath><clipPath id="cb1"><path d="M-16 54Q-16 4 0-4Q16 4 16 54Z"/></clipPath>
<rect id="sTop" clip-path="url(#ct1)" x="-16" y="-30" width="32" height="26" fill="#e3c27a"/><rect id="sBot" clip-path="url(#cb1)" x="-16" y="54" width="32" height="0" fill="#e3c27a"/><rect id="sStream" x="-1" y="-4" width="2" height="58" fill="#e3c27a" opacity="0"/></svg>`}
$('#hg').innerHTML=hgSVG(false);
function setSand(f,running){const top=$('#sTop'),bot=$('#sBot'),st=$('#sStream');if(!top)return;const tH=26*(1-f),bH=26*f;top.setAttribute('y',-4-tH);top.setAttribute('height',tH);bot.setAttribute('y',54-bH);bot.setAttribute('height',bH);st.setAttribute('opacity',running?.9:0)}
const coopBase=document.createElement('canvas');coopBase.width=W;coopBase.height=H;const cbx=coopBase.getContext('2d');paper(cbx);let baseIds='';
function drawCoopBase(){const ids=S.coopMarks.map(m=>m.id).join(',');if(ids==baseIds)return;
if(baseIds&&ids.startsWith(baseIds)){const done=new Set(baseIds.split(','));for(const m of S.coopMarks)if(!done.has(m.id))for(const s of m.strokes||[])try{replay(cbx,s)}catch(e){}}
else{paper(cbx);for(const m of S.coopMarks)for(const s of m.strokes||[])try{replay(cbx,s)}catch(e){}}baseIds=ids}
function drawCoop(){drawCoopBase();if(S.mode!='coop')return;cx.globalCompositeOperation='source-over';cx.drawImage(coopBase,0,0);for(const s of S.mine)replay(cx,s)}
async function fetchCoop(){const today=dayKey();const[marks,turn]=await Promise.all([C.list('coop:m:'+today+':'),C.get('coop:turn')]);
S.coopMarks=marks.map(m=>({...m.value,id:m.key})).filter(m=>m&&Array.isArray(m.strokes)).sort((a,b)=>a.at-b.at||(a.id<b.id?-1:1));S.turn=turn}
function turnActive(t){return t&&!t.done&&Date.now()-t.start<TURN+2500}
function lastBy(){const m=S.coopMarks[S.coopMarks.length-1];return m?m.by:null}
async function refreshCoop(){try{await fetchCoop()}catch(e){return}drawCoop();coopUI()}
function coopUI(){if(S.mode!='coop')return;const st=$('#status'),t=S.turn,me=S.name;
if(S.myTurn){const left=Math.max(0,Math.ceil((S.turnEnd-Date.now())/1000));st.textContent=`Your mark! ${left}s of sand left`;return}
if(turnActive(t)){st.textContent=`${t.by}${t.kind=='agent'?' (agent)':''} is painting… wait for the sand.`;$('#hg svg').style.transform='rotate(180deg)';setSand(Math.min(1,(Date.now()-t.start)/TURN),true);return}
$('#hg svg').style.transform='rotate(0deg)';setSand(0,false);
if(S.coopMarks.length>=300){st.textContent='The canvas is full for today. Fresh one at midnight!';return}
if(me&&lastBy()==me){st.textContent='You made the last mark. Wait for someone else to go.';return}
st.textContent=S.coopMarks.length?`Your turn is free. Touch the canvas to flip the hourglass.`:`A fresh canvas! Touch it to make the first mark.`}
async function coopCanStart(){if(S.myTurn)return true;
const n=await askName('Your name goes in the co-op log next to your mark.');if(!n)return false;
await refreshCoop();if(turnActive(S.turn)&&S.turn.by!==n){toast(`${S.turn.by} has the hourglass. Wait for the sand!`);return false}
if(lastBy()==n){toast('You made the last mark. Someone else goes next!');return false}
if(S.coopMarks.length>=300){toast('Full for today. Come back after midnight!');return false}
const claim={by:n,kind:'human',start:Date.now(),day:dayKey()};await C.set('coop:turn',claim);
await new Promise(r=>setTimeout(r,350));const chk=await C.get('coop:turn');if(!chk||chk.by!==n||chk.start!==claim.start){toast('Someone grabbed the hourglass first!');refreshCoop();return false}
startTurn(claim);return true}
let turnTimer=null;
function startTurn(claim){S.myTurn=true;S.mine=[];S.turnEnd=claim.start+TURN;sfx('flip');$('#hg svg').style.transform='rotate(180deg)';$('#undoBtn').style.display='inline-block';toast('The hourglass flipped! 10 seconds. Make your mark ✎');
clearInterval(turnTimer);turnTimer=setInterval(()=>{const f=Math.min(1,1-(S.turnEnd-Date.now())/TURN);setSand(f,true);coopUI();if(Date.now()>=S.turnEnd){clearInterval(turnTimer);finishTurn()}},120)}
async function finishTurn(){if(cur)endStroke();S.myTurn=false;$('#undoBtn').style.display='none';setSand(1,false);const strokes=S.mine.slice();S.mine=[];
const day=dayKey(S.turnEnd-TURN);
if(strokes.length){let mark={by:S.name,kind:'human',at:Date.now(),day,strokes};
let j=JSON.stringify(mark);while(j.length>15500){mark.strokes=mark.strokes.map(s=>({...s,p:s.p.filter((_,i)=>i%4<2||i>=s.p.length-2)}));const nj=JSON.stringify(mark);if(nj.length>=j.length)break;j=nj}
try{await C.set('coop:m:'+day+':'+rid(),mark);sfx('pub');toast('Your mark is in! Someone else goes next.')}catch(e){toast('Your mark did not save. Sorry!')}}
else toast('The sand ran out. No mark this time.');
try{await C.set('coop:turn',{by:S.name,kind:'human',start:S.turnEnd-TURN,day,done:true})}catch(e){}refreshCoop()}
$('#logBtn').addEventListener('click',()=>{const l=S.coopMarks.slice().reverse();openModal(`<h2>Today's marks</h2><div class="meta">${esc(fmtDay(dayKey()))} · resets at midnight (Pacific) and goes up on the gallery wall</div>${l.length?`<ol class="log" reversed>${l.map(m=>`<li><b>${esc(m.by)}</b>${m.kind=='agent'?'<span class="badge">agent</span>':''} · ${new Date(m.at).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})} · ${esc((m.strokes||[]).map(s=>s.tool).filter((v,i,a)=>a.indexOf(v)==i).join(', '))}</li>`).join('')}</ol>`:'<p>No marks yet today. Yours could be the first.</p>'}<div class="acts"><button class="btn pri" onclick="closeModal()">back to the easel</button></div>`)});

/* daily roll-over: any visitor hangs yesterday's co-op canvas and clears the old marks */
let rolling=false;
async function rollover(){if(rolling)return;rolling=true;try{const today=dayKey(),all=await C.list('coop:m:'),by={};
for(const m of all){const d=m.key.split(':')[2];if(d&&d<today)(by[d]=by[d]||[]).push({...m.value,key:m.key})}
for(const d of Object.keys(by).sort()){const marks=by[d].filter(m=>m&&Array.isArray(m.strokes)).sort((a,b)=>a.at-b.at);
if(marks.length&&!(await C.get('daily:'+d))){const t=document.createElement('canvas');t.width=W;t.height=H;const x=t.getContext('2d');paper(x);for(const m of marks)for(const s of m.strokes)try{replay(x,s)}catch(e){}
const seen=new Map();for(const m of marks)if(!seen.has(m.by))seen.set(m.by,{by:m.by,kind:m.kind||'human'});
await C.set('daily:'+d,{day:d,img:snapshot(t,14000),marks:marks.length,artists:[...seen.values()].slice(0,40),at:Date.parse(d+'T23:59:00-08:00')})}
for(const m of by[d])await C.del(m.key)}}catch(e){}rolling=false}

async function loadPreview(){try{await fetchCoop();drawCoopBase();$('#preview').src=coopBase.toDataURL('image/jpeg',.7)}catch(e){}}

/* ---------- live updates ---------- */
let chT=0;C.onChange(()=>{clearTimeout(chT);chT=setTimeout(()=>{if(S.room=='gallery'){loadWall();loadPreview()}if(S.mode=='coop'&&!S.myTurn)refreshCoop()},500)});
setInterval(()=>{if(S.mode=='coop'&&!S.myTurn)coopUI()},500);
setInterval(()=>{if(S.mode=='coop'&&!S.myTurn)refreshCoop()},8000);
setInterval(rollover,60000);

/* ---------- gentle sound (off by default) ---------- */
let AC,amb;function ac(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();return AC}
function tone(f,d=.25,v=.05,type='sine'){if(!S.sound)return;const a=ac(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function sfx(k){if(!S.sound)return;({pick:()=>tone(660,.18,.04),dip:()=>{tone(880,.3,.04);setTimeout(()=>tone(1175,.4,.03),90)},stroke:()=>tone(330,.12,.015,'triangle'),pub:()=>[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.5,.05),i*120)),step:()=>tone(392,.25,.03,'triangle'),flip:()=>[784,587].forEach((f,i)=>setTimeout(()=>tone(f,.3,.05),i*140))}[k]||(()=>0))()}
$('#sndBtn').addEventListener('click',()=>{S.sound=!S.sound;$('#sndBtn').textContent=S.sound?'♪ on':'♪ off';clearInterval(amb);if(S.sound){ac();const sc=[262,294,330,392,440,523];const play=()=>{const a=ac(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=sc[(Math.random()*6)|0]*(Math.random()<.3?.5:1);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+1.5);g.gain.linearRampToValueAtTime(0,t+5);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+5.2)};play();amb=setInterval(play,3600)}});

/* ---------- start ---------- */
rollover();loadWall();
setTimeout(()=>toast('Pick something up from the table to start ✎',3400),900);
</script>
